<!DOCTYPE html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14131b"><title>ЭКТ · Тепловая карта вызовов</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f3effa;background:#14131b;font:16px/1.5 Inter,"Segoe UI",sans-serif}header{border-bottom:1px solid #36323f}.wrap{width:min(1140px,92%);margin:auto}nav{height:66px;display:flex;align-items:center;gap:12px;font-weight:700}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#ccaeff;color:#251638;font-size:21px}.navsub{padding-left:14px;border-left:1px solid #524b60;color:#b4adbf;font-weight:400}h1{font-size:clamp(33px,4.2vw,59px);line-height:1.1;letter-spacing:-.05em;margin:0}h2{font-size:21px;letter-spacing:-.025em;margin:0}p{color:#bbb5c7}.intro{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:40px 0 25px}.intro p{margin:10px 0 0}.switch{display:flex;gap:4px;padding:4px;border-radius:12px;background:#211e2a;border:1px solid #393443}button{font:inherit;cursor:pointer;color:inherit}.switch button,.undo{border:0;border-radius:8px;padding:8px 13px;background:transparent;color:#c6bfd1;white-space:nowrap}.switch [aria-pressed=true]{background:#d2b7ff;color:#261a38;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(255px,1fr);gap:18px;margin-bottom:30px}.panel{background:#1e1b26;border:1px solid #383340;border-radius:20px;padding:22px}.maphead,.sectionhead,.legend{display:flex;align-items:center;justify-content:space-between;gap:8px}.small,small{font-size:14px;color:#b4acbf}.floor{margin:17px 0;background-color:#18151e;background-image:radial-gradient(#37303f 1px,transparent 1px);background-size:14px 14px;border:1px solid #3a3342;border-radius:14px;padding:14px clamp(9px,3vw,45px) 20px}.board{background:#393342;border-top:3px solid #a691ba;color:#ddd3e7;border-radius:3px 3px 9px 9px;width:47%;text-align:center;font-size:14px;letter-spacing:.13em;margin:0 auto 18px}.row{display:grid;grid-template-columns:18px 1fr minmax(9px,7%) 1fr;align-items:center;margin-top:8px}.rowlabel{color:#aa9fb6;font:13px monospace}.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#36303f;padding:4px;border-radius:8px;border-bottom:3px solid #494050}.desk + .desk{grid-column:4}.seat{min-height:38px;background:var(--heat);border:1px solid #ffffff21;border-radius:5px;font:600 14px/1 monospace;color:var(--ink);transition:filter .12s}.seat:hover{filter:brightness(1.25)}button:focus-visible{outline:3px solid white;outline-offset:2px}.legend{justify-content:flex-start;flex-wrap:wrap;color:#bfb7cb;font-size:14px}.scale{display:flex;gap:3px}.scale i{width:16px;height:10px;border-radius:3px}.side{display:flex;flex-direction:column;gap:16px}.big{font:600 53px/1.2 "Segoe UI",sans-serif;letter-spacing:-.065em;margin:12px 0 0;color:#d6bdff}.metric{display:flex;align-items:baseline;gap:12px}.peak{border-top:1px solid #38313f;margin-top:15px;padding-top:13px;color:#c7bfd1}.peak strong{color:#f2e9ff}.undo{background:#332d3e;font-size:14px;padding:5px 9px}.undo:disabled{opacity:.4;cursor:default}.history{list-style:none;padding:0;margin:12px 0 0}.history li{padding:9px 0;border-top:1px solid #393240;display:flex;justify-content:space-between;align-items:center}.empty{margin:16px 0 3px}.note{margin:0 4px;color:#b3a9bf;font-size:14px}.live{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}@media(max-width:800px){.layout{grid-template-columns:1fr}.intro{align-items:flex-start;flex-direction:column;margin-top:26px}.panel{padding:16px}.floor{padding-inline:8px}.row{grid-template-columns:14px 1fr 4% 1fr}.seat{min-height:40px}.desk{padding:3px;gap:2px}.maphead{flex-wrap:wrap}}
.teacher{grid-column:4;display:grid;place-items:center;border:1px dashed #70657d;border-radius:8px;color:#c6bacf;text-align:center;font-size:14px;padding:3px;line-height:1.2}
</style>
<header><nav class="wrap"><span class="mark" aria-hidden="true">▦</span> ЭКТ <span class="navsub">Карта аудитории</span></nav></header>
<main class="wrap"><div class="intro"><div><h1>Тепловая карта вызовов</h1><p>Нажмите на место, когда преподаватель вызовет студента.</p></div><div class="switch" aria-label="Режим карты"><button id="mine" aria-pressed="true">Моя карта</button><button id="example" aria-pressed="false">Пример</button></div></div>
<div class="layout"><section class="panel"><div class="maphead"><h2>План аудитории</h2><span class="small">Окна справа</span></div><div class="floor"><div class="board">ДОСКА</div><div class="row"><div class="teacher">Стол преподавателя</div></div><div id="rows"></div></div><div class="legend">Реже <span class="scale" id="scale"></span> Чаще</div></section>
<aside class="side"><section class="panel"><h2>Статистика</h2><div class="metric"><strong id="total" class="big">0</strong><span class="small">вызовов всего</span></div><div id="peak" class="peak"></div></section><section class="panel"><div class="sectionhead"><h2>Последние вызовы</h2><button id="undo" class="undo">Отменить</button></div><ul class="history" id="history"></ul><p class="small empty" id="empty">Здесь появится первая отметка.</p></section><p class="note" id="note"></p></aside></div><div class="live" role="status" id="status"></div></main>
<script>
'use strict';
const el=id=>document.getElementById(id);
const colors=['#443d50','#685579','#916aa0','#ba79a6','#df9089','#ffc37c'];
const letters='АБВГДЕ';
const key='ekt-seat-calls-v1';
let demo=false, storageOK=true;
function readLog(){
  try{
    const data=JSON.parse(localStorage.getItem(key)||'[]');
    return Array.isArray(data)?data.filter(e=>Number.isInteger(e.s)&&e.s>=0&&e.s<45&&Number.isFinite(e.t)):[];
  }catch{storageOK=false;return []}
}
let log=readLog();
const sample=[0,2,6,6,7,8,9,9,9,12,12,12,12,12,13,13,14,16,19,19,24,24,29,34,8,12,7,7,2,15].map((s,i)=>({s,t:Date.now()-(30-i)*60000}));
const seatName=s=>(1+Math.floor(s/6))+letters[s%6];
const seats=[];
for(let r=0;r<8;r++){
  const row=document.createElement('div');row.className='row';
  const label=document.createElement('span');label.className='rowlabel';label.textContent=r+1;row.append(label);
  const deskCount=r===7?1:2;
  for(let d=0;d<deskCount;d++){
    const desk=document.createElement('div');desk.className='desk';row.append(desk);
    for(let j=0;j<3;j++){
      const s=r*6+d*3+j, button=document.createElement('button');button.className='seat';button.textContent=seatName(s);
      button.onclick=()=>change(s);desk.append(button);seats.push(button);
    }
  }
  el('rows').append(row);
}
for(const color of colors){const i=document.createElement('i');i.style.background=color;el('scale').append(i)}
function change(s){
  const events=demo?sample:(storageOK?readLog():log);
  const event=s===null?events.pop():{s,t:Date.now()};
  if(!event)return;
  if(s!==null)events.push(event);
  if(!demo){log=events;try{localStorage.setItem(key,JSON.stringify(log));storageOK=true}catch{storageOK=false}}
  el('status').textContent=(s===null?'Отменён вызов с места ':'Отмечен вызов с места ')+seatName(event.s);
  render();
}
function render(){
  const events=demo?sample:log, counts=Array(seats.length).fill(0);
  events.forEach(e=>counts[e.s]++);
  const max=Math.max(...counts);
  seats.forEach((b,s)=>{
    const level=counts[s]?Math.ceil(counts[s]/max*5):0;
    b.style.setProperty('--heat',colors[level]);b.style.setProperty('--ink',level>=3?'#201720':'#fff');
    b.title='Место '+seatName(s)+' · вызовов: '+counts[s];b.setAttribute('aria-label',b.title+'. Добавить вызов');
  });
  el('total').textContent=events.length;
  const top=counts.flatMap((n,s)=>n===max?[seatName(s)]:[]);
  el('peak').textContent=max?'Чаще всего вызывают: '+top.join(', ')+' · вызовов на место: '+max:'Пока нет отмеченных вызовов.';
  el('history').replaceChildren();
  events.slice(-5).reverse().forEach(e=>{
    const li=document.createElement('li'), time=document.createElement('small');
    li.append('Место '+seatName(e.s));time.textContent=new Date(e.t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});li.append(time);el('history').append(li);
  });
  el('empty').hidden=!!events.length;el('undo').disabled=!events.length;
  el('mine').setAttribute('aria-pressed',String(!demo));el('example').setAttribute('aria-pressed',String(demo));
  el('note').textContent=demo?'Пример с условными вызовами. Можно попробовать отметить место.':storageOK?'Отметки сохраняются в этом браузере.':'Сохранение недоступно. Отметки останутся до закрытия страницы.';
}
el('mine').onclick=()=>{demo=false;render()};el('example').onclick=()=>{demo=true;render()};el('undo').onclick=()=>change(null);
window.addEventListener('storage',e=>{if(e.key===key||e.key===null){log=readLog();render()}});
render();
</script></html>
